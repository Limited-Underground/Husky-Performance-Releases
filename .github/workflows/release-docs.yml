name: Current release documentation
on:
  release:
    types: [published]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check current documentation against latest release
        id: freshness
        continue-on-error: true
        run: python tools/sync-release.py
      - name: Prepare review files when documentation differs
        if: steps.freshness.outcome == 'failure'
        run: |
          python tools/sync-release.py --write
          git diff -- README.md PROJECT-STATUS.md TESTING-PARTNERS.md CHANGELOG.md CURRENT-RELEASE.json > release-docs.patch
      - uses: actions/upload-artifact@v4
        if: steps.freshness.outcome == 'failure'
        with:
          name: release-documentation-review
          path: |
            release-docs.patch
            README.md
            PROJECT-STATUS.md
            TESTING-PARTNERS.md
            CHANGELOG.md
            CURRENT-RELEASE.json
      - name: Require review and separately authorized publication
        if: steps.freshness.outcome == 'failure'
        run: |
          echo "Review the generated artifact. No commit, push, PR or release modification was performed."
          exit 1
